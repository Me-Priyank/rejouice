<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="../styles/conntact.css">
</head>
<body>
    <div id="faram">
        <form class="contact-form">
            <h1>Hi, Tap That team.</h1>
            
            <div class="form-content">
                <p>
                    My name is 
                    (<input type="text" placeholder="Jane Doe" class="inline-input">). 
                    I'm reaching out because I'm looking 
                    <select class="inline-select">
                        <option>to design and develop</option>
                    </select>
                    a 
                    <select class="inline-select">
                        <option>simple and uncomplicated</option>
                    </select>
                    <select class="inline-select">
                        <option>landing page</option>
                    </select>
                    for 
                    <input type="text" placeholder="interior design studio based in Toronto" class="inline-input long-input">.
                </p>
    
                <p>
                    I already have
                    <div class="checkbox-group">
                        <label><input type="checkbox"> Branding style</label>
                        <label><input type="checkbox"> Logo</label>
                        <label><input type="checkbox"> Copy</label>
                        <label><input type="checkbox"> Photos and videos</label>
                        <label><input type="checkbox"> Target audience insights</label>
                        <label><input type="checkbox"> Marketing research insights</label>
                        <label><input type="checkbox"> Brief</label>
                    </div>
                </p>
    
                <p>
                    My budget is 
                    <select class="inline-select">
                        <option>EUR 5 000 - 8 000</option>
                    </select>
                    And it would be perfect to launch the project in
                    <select class="inline-select">
                        <option>3 weeks</option>
                    </select>
                </p>
    
                <p>
                    Also, 
                    <input type="text" placeholder="I want to add a catalog and set the payment sy..." class="inline-input long-input">
                </p>
    
                <p>
                    Please contact me via 
                    <select class="inline-select">
                        <option>Email</option>
                    </select>
                    at 
                    <input type="email" placeholder="janedoe@gmail.com" class="inline-input">
                </p>
    
                <p>
                    Cheers,<br>
                    <input type="text" placeholder="Jane Doe" class="inline-input">.
                </p>
    
                <button type="submit" class="send-button">
                    Send
                    <span class="arrow">→</span>
                </button>
            </div>
        </form>
    </div>
</body>
</html>
