                </div>
            </div>

            <div class="form-group">
                <label>Also,</label>
                <input type="text" id="additional" name="additional_message" placeholder="Additional Message">
            </div>

            <div class="form-group">
                <label>Please contact me via</label>
                <input type="email" id="contactMethod" name="contact_method" placeholder="Your Email" required>
                <input type="hidden" name="subject" value="New Project Inquiry">

                <input type="hidden" name="replyto" value="%email%">

            <button type="submit" class="submit-btn">
                Send
